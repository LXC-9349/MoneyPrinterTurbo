title = "MoneyPrinterTurbo gitleaks config"

# 复用 gitleaks 内置规则集（覆盖常见云厂商 / OpenAI / GitHub / Pexels 等密钥格式）
[extend]
useDefault = true

# 白名单：仅豁免「明确是占位符/示例/测试桩」的内容，真实凭据不在其中。
[allowlist]
description = "示例配置与测试桩中的假令牌，非真实凭据"
paths = [
    '''config\.example\.toml''',
    '''\.env\.example''',
    '''frontend/\.env\.example''',
    '''test/services/.*''',
]
regexes = [
    # 测试里用于断言流程的固定假令牌（含连字符的小写描述串）
    '''(?i)(current-user-token|session-token|config-token|dummy|placeholder|example)''',
    # 常见占位符写法
    '''(?i)(your[-_ ]?(api[-_ ]?)?key|sk-xxx+|xxxx+|<[^>]+>|填入|请输入)''',
]
