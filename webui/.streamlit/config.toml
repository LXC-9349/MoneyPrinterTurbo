[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[logger]
hideWelcomeMessage = true

# ---------------------------------------------------------------------------
# 主题:深色"工作室"配色。整体观感从这里改变,styles.css 只做组件级精修。
# 主色 #4682B4(钢蓝)、暗底 #0A0E14、文字 #C8D6E5。
# ---------------------------------------------------------------------------
[theme]
base = "dark"
primaryColor = "#4682B4"
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#121821"
textColor = "#C8D6E5"
font = "sans serif"

[server]
headless = true
